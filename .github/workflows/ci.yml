name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint 与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码检查（ESLint）
        run: npm run lint

      - name: 构建（含 TypeScript 严格类型检查）
        run: npm run build
