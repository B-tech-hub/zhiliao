name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint、测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 版本一致性
        run: npm run check:version

      - name: 设计系统门禁
        run: npm run check:design

      - name: 代码检查（ESLint）
        run: npm run lint

      - name: 单元测试（Vitest）
        env:
          REQUIRE_DOCKER_COMPOSE: "1"
        run: npm test

      - name: 构建（含 TypeScript 严格类型检查）
        run: npm run build
