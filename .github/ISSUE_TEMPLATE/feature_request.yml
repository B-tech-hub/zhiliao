name: 功能建议
description: 希望增加或改进的功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说明：知了定位为**单用户、自托管**的个人知识库，多用户 / SaaS / 账号体系类需求不在规划内（见 README 的 Roadmap 一节），敬请谅解。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
