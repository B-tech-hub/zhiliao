services:
  app:
    # 默认使用预构建镜像（amd64/arm64）；想本地构建时注释掉 image 行、取消 build 行注释
    image: ghcr.io/b-tech-hub/zhiliao:latest
    # build: .
    container_name: zhiliao
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 必填：登录密码与会话密钥
      APP_PASSWORD: ${APP_PASSWORD:?请在 .env 中设置 APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      # LLM（OpenAI 兼容格式，可切换 DeepSeek / 通义 / Claude 兼容端点等）
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      # 深度思考模型（可选，助手输入框的「深度思考」开关用）：模型名必须显式配置，
      # 接入点与 Key 留空则回落上方 LLM 配置。也可以只在设置页配，不走环境变量。
      REASONING_BASE_URL: ${REASONING_BASE_URL:-}
      REASONING_API_KEY: ${REASONING_API_KEY:-}
      REASONING_MODEL: ${REASONING_MODEL:-}
      # 视觉模型（AI 读图）与图像模型（AI 画图）：留空则在设置页配置
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_TIMEOUT_MS: ${IMAGE_TIMEOUT_MS:-180000}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
      # 时区：默认 UTC。「每周回顾」按此分周，中国用户建议在 .env 里设 Asia/Shanghai
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/db:/data/db
      - ./data/uploads:/data/uploads
