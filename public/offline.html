<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>当前离线 · 知识库</title>
    <script>
      /* 与应用共享 localStorage("theme") 偏好；system 或缺省时回落系统深浅色 */
      var t = localStorage.getItem("theme");
      if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
        document.documentElement.classList.add("dark");
    </script>
    <style>
      /* 与 globals.css 同源的最小 token 子集（离线页零外部依赖，Inter 不可用回落系统字体） */
      :root {
        --parchment: #f5f5f7;
        --surface: #ffffff;
        --ink: #1d1d1f;
        --ink-48: #7a7a7a;
        --action: #0066cc;
      }
      .dark {
        --parchment: #000000;
        --surface: #1c1c1e;
        --ink: #f5f5f7;
        --ink-48: #98989d;
        --action: #2997ff;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
        background: var(--parchment);
        color: var(--ink);
        font-family: system-ui, -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 17px;
        line-height: 1.47;
        letter-spacing: -0.2px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 360px;
        padding: 40px 32px;
        border-radius: 18px;
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.374px;
      }
      p {
        margin: 0 0 28px;
        font-size: 14px;
        color: var(--ink-48);
      }
      button {
        padding: 11px 28px;
        border: 0;
        border-radius: 9999px;
        background: var(--action);
        color: #ffffff;
        font-family: inherit;
        font-size: 17px;
        cursor: pointer;
        transition: transform 0.15s;
      }
      button:active {
        transform: scale(0.95);
      }
      svg {
        margin-bottom: 20px;
        color: var(--ink-48);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
      <h1>网络不可用</h1>
      <p>连不上服务器。请检查网络（或 Tailscale 连接）后重试。</p>
      <button onclick="location.reload()">重试</button>
    </main>
  </body>
</html>
